<!doctype html>
<html lang="zh-CN" data-theme="light" data-accent="ya">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/src/assets/favicon.ico" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>我去抢个座</title>
  <script>
    // 首帧前落主题，避免浅色闪烁；读持久化 store，失败回退鸦青浅色
    (function () {
      var root = document.documentElement;
      var mode = 'system';
      var accent = 'ya';
      try {
        var saved = JSON.parse(localStorage.getItem('igolib:theme:v1') || '{}');
        var modes = ['system', 'dark', 'light'];
        var accents = ['ya', 'pine', 'dai', 'zhe', 'jiang', 'qingci', 'xing', 'moka', 'xiang'];
        if (modes.indexOf(saved.state && saved.state.mode) >= 0) mode = saved.state.mode;
        else if (modes.indexOf(localStorage.getItem('vite-ui-theme')) >= 0) mode = localStorage.getItem('vite-ui-theme');
        if (saved.state && accents.indexOf(saved.state.accent) >= 0) accent = saved.state.accent;
      } catch (e) { }
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      root.classList.toggle('dark', dark);
      root.classList.toggle('light', !dark);
      root.dataset.theme = dark ? 'dark' : 'light';
      root.dataset.accent = accent;
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>

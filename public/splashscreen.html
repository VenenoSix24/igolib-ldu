<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startup</title>
  <style>
    :root {
      /* Default to Light Mode to be safe, then override for dark */
      --bg-color: #ffffff;
      --text-title: #0f172a;
      --text-subtitle: #64748b;
      --text-footer: #94a3b8;
      --loader-bg: rgba(0, 0, 0, 0.1);
      --glow-color: rgba(25, 127, 230, 0.1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f1115;
        --text-title: #ffffff;
        --text-subtitle: #64748b;
        --text-footer: #475569;
        --loader-bg: rgba(255, 255, 255, 0.1);
        --glow-color: rgba(25, 127, 230, 0.15);
      }
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Wrap everything in a rounded container */
    .app-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      border-radius: 20px;
      /* Rounded corners for the window content */
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 1px 1px rgba(0, 0, 0, 0.05);
      /* Subtle border definition */
    }

    .container {
      text-align: center;
      position: relative;
      z-index: 2;
      /* Content above glow */
    }

    .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, var(--glow-color) 0%, rgba(0, 0, 0, 0) 70%);
      transform: translate(-50%, -50%);
      z-index: 1;
      /* Glow behind content but inside wrapper */
      pointer-events: none;
    }

    /* Logo / Title Area */
    .title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-title);
      margin-bottom: 24px;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--text-subtitle);
      margin-bottom: 40px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Loader */
    .loader-container {
      width: 200px;
      height: 4px;
      background: var(--loader-bg);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
      margin: 0 auto;
    }

    .loader-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, #197fe6, #6366f1);
      border-radius: 2px;
      animation: loading 1.5s infinite ease-in-out;
      transform: translateX(-100%);
    }

    @keyframes loading {
      0% {
        transform: translateX(-100%);
      }

      50% {
        transform: translateX(100%);
      }

      100% {
        transform: translateX(-100%);
      }
    }

    .footer {
      position: absolute;
      bottom: 20px;
      font-size: 10px;
      color: var(--text-footer);
      width: 100%;
      text-align: center;
      z-index: 2;
    }
  </style>
</head>

<body>
  <div class="app-wrapper">
    <div class="glow"></div>
    <div class="container">
      <div class="title">我去抢个座</div>
      <div class="subtitle">LIBRARY SEAT RESERVATION</div>

      <div class="loader-container">
        <div class="loader-bar"></div>
      </div>
    </div>

    <div class="footer">
      LOADING RESOURCES...
    </div>
  </div>
</body>

</html>

name: 'Diagnostic Build'

# 手动触发，构建带日志导出的诊断版安装包。
#
# 这份工作流刻意与 release.yml 保持同一套写法（矩阵、步骤、动作版本），
# 只做最小差异：产物挂到诊断版 Release，并给每个平台追加 --config 切到诊断模式。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '存放构建产物的 Release 标签（留空则使用 diag-latest）'
        required: false
        default: 'diag-latest'

jobs:
  # 任务 1：创建/复用 Release
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Get version
        run: echo "PACKAGE_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Create Release
        id: create-release
        uses: actions/github-script@v8
        env:
          TAG_NAME: ${{ inputs.tag || 'diag-latest' }}
        with:
          script: |
            const tag = process.env.TAG_NAME;

            // 防呆：下面会删掉同名 Release 再重建，只允许诊断版自己的标签
            if (!tag.startsWith('diag')) {
              core.setFailed(`拒绝使用非诊断版标签 "${tag}"：该流程会删除同名 Release 后重建`);
              return;
            }

            // 注意：GET /releases/tags/{tag} 不返回 draft，所以这里必须用列表接口。
            // 先清掉同名 Release（含 draft），保证每次产出的都是一套干净、不重复的产物，
            // 同时下载链接按 tag 保持稳定。
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            for (const release of releases) {
              if (release.tag_name === tag) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id
                });
              }
            }

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `我去抢个座 诊断版 ${tag}`,
              body: '带日志导出的诊断版构建产物，用于收集排障日志，非正式发布版本。',
              draft: true,
              prerelease: true
            });

            return data.id;

  # 任务 2：构建并上传（矩阵与 release.yml 一致）
  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- macOS 构建 --- #
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            config: 'src-tauri/tauri.diag.conf.json'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            config: 'src-tauri/tauri.diag.conf.json'

          # --- Linux 构建 --- #
          - platform: 'ubuntu-22.04'
            args: ''
            config: 'src-tauri/tauri.diag.conf.json'

          # --- Windows 64 构建 --- #
          - platform: 'windows-latest'
            args: ''
            config: 'src-tauri/tauri.diag.conf.json'

          # --- Windows 32 构建 --- #
          - platform: 'windows-latest'
            args: '--target i686-pc-windows-msvc'
            config: 'src-tauri/tauri.diag.conf.json'

          # --- Android 构建 --- #
          # 安卓必须用 mobile 版配置：CLI 会按 identifier 推导 gen/android 下的工程目录，
          # 换成桌面那份（identifier 已改为 com.igolib.ldu.diag）会直接报目录不存在
          - platform: 'ubuntu-22.04'
            args: '--apk --split-per-abi --target aarch64'
            config: 'src-tauri/tauri.diag.mobile.conf.json'
            mobile: 'android'
          - platform: 'ubuntu-22.04'
            args: '--apk --split-per-abi --target armv7'
            config: 'src-tauri/tauri.diag.mobile.conf.json'
            mobile: 'android'
          - platform: 'ubuntu-22.04'
            args: '--apk --split-per-abi --target x86_64'
            config: 'src-tauri/tauri.diag.mobile.conf.json'
            mobile: 'android'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || (matrix.mobile == 'android' && 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android' || 'i686-pc-windows-msvc') }}

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Setup Java
        if: matrix.mobile == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        if: matrix.mobile == 'android'
        uses: android-actions/setup-android@v4

      # --- 安卓签名 --- #
      - name: Prepare Android Signing
        if: matrix.mobile == 'android'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          # 确保目录存在
          mkdir -p src-tauri/gen/android/app

          # 1. 解码 Keystore 文件
          echo "$KEYSTORE_BASE64" | base64 --decode > src-tauri/gen/android/app/release.jks

          # 2. 生成 properties 文件
          cat <<EOF > src-tauri/gen/android/keystore.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF

      # --- Tauri Action --- #
      # 诊断版不传更新签名密钥（配置里 createUpdaterArtifacts=false），
      # 避免产出可被当作正式更新源的签名产物
      - uses: tauri-apps/tauri-action@dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }} --config ${{ matrix.config }}
          mobile: ${{ matrix.mobile }}
          uploadUpdaterSignatures: false
          uploadPlainBinary: ${{ matrix.platform == 'windows-latest' }}
          releaseAssetNamePattern: 'igolib_ldu-diag-[version]-[platform]-[arch][setup][ext]'

name: 'Release Build'

on:
  push:
    tags:
      - 'v*'             # 推送 v 开头的标签触发构建发布
  workflow_dispatch:     # 允许网页手动点击运行

jobs:
  # 任务 1：创建 Release
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Get version
        run: echo "PACKAGE_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Create Release
        id: create-release
        uses: actions/github-script@v8
        env:
          # 如果是 tag 触发，使用 tag 名；否则使用 manual-build
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || 'manual-test-build release' }}
          # 如果 tag 包含 "-" 则设为 pre-release
          IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}
        with:
          script: |
            try {
              // 尝试获取已经存在的 Release
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.TAG_NAME
              })
              return data.id
            } catch (error) {
              // 如果没有找到，新建一个 Draft Release
              if (error.status === 404) {
                const { data } = await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: process.env.TAG_NAME,
                  name: `我去抢个座 ${process.env.TAG_NAME}`,
                  body: 'Release assets for 我去抢个座',
                  draft: true,
                  prerelease: process.env.IS_PRERELEASE === 'true'
                })
                return data.id
              }
              throw error
            }

  # 任务 2：构建并上传
  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- macOS 构建 --- #
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          
          # --- Linux 构建 --- #
          - platform: 'ubuntu-22.04'
            args: ''
          
          # --- Windows 64 构建 --- #
          - platform: 'windows-latest'
            args: ''
          
          # --- Windows 32 构建 --- #
          - platform: 'windows-latest'
            args: '--target i686-pc-windows-msvc' 

          # --- Android 构建 --- #
          - platform: 'ubuntu-22.04'
            args: '--apk true --split-per-abi --target aarch64'
            mobile: 'android'
          - platform: 'ubuntu-22.04'
            args: '--apk true --split-per-abi --target armv7'
            mobile: 'android'
          - platform: 'ubuntu-22.04'
            args: '--apk true --split-per-abi --target x86_64'
            mobile: 'android'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || (matrix.mobile == 'android' && 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android' || 'i686-pc-windows-msvc') }}

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Setup Java
        if: matrix.mobile == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        if: matrix.mobile == 'android'
        uses: android-actions/setup-android@v4

      # --- 安卓签名 --- #
      - name: Prepare Android Signing
        if: matrix.mobile == 'android'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          # 确保目录存在
          mkdir -p src-tauri/gen/android/app
          
          # 1. 解码 Keystore 文件
          echo "$KEYSTORE_BASE64" | base64 --decode > src-tauri/gen/android/app/release.jks
          
          # 2. 生成 properties 文件
          cat <<EOF > src-tauri/gen/android/keystore.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF

      # --- Tauri Action --- #
      - uses: tauri-apps/tauri-action@dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          mobile: ${{ matrix.mobile }}
          uploadUpdaterSignatures: false
          uploadPlainBinary: ${{ matrix.platform == 'windows-latest' }}
          releaseAssetNamePattern: 'igolib_ldu-[version]-[platform]-[arch][setup][ext]'

  # 任务 3：发布 (仅在 Tag 触发时运行)
  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri]
    # 如果是手动触发，不运行此步，Release 保持为 Draft
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')

    steps:
      - name: Publish Release
        uses: actions/github-script@v8
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: true
            })
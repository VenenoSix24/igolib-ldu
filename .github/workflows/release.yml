name: Release Build

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  # 新增：允许在网页端手动点击按钮触发测试
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      
      # 逻辑：如果是手动触发，版本号默认为 "manual-test"
      # 如果是 Tag 触发，则使用 Tag 名
      - name: Determine Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=manual-test-$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
            if [[ "${{ github.ref_name }}" == *"-"* ]]; then
              echo "IS_PRERELEASE=true" >> $GITHUB_ENV
            else
              echo "IS_PRERELEASE=false" >> $GITHUB_ENV
            fi
          fi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }} # 显式指定 Tag 名
          name: Library Seat ${{ env.TAG_NAME }}
          body: "Auto-generated release. \nTrigger: ${{ github.event_name }}"
          draft: true # 默认为草稿，测试完如果不想要可以直接删掉
          prerelease: ${{ env.IS_PRERELEASE }} # 如果是 beta 版则标记为预发布

  # ====================================================
  # 1. Android 构建
  # ====================================================
  build-android:
    needs: create-release
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            arch_name: arm64-v8a
          - target: x86_64-linux-android
            arch_name: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install -g pnpm && pnpm install
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: ${{ matrix.target }} }

      # --- 自动修正 App 中文名 (双重保险) ---
      # 这里的 sed 会去替换 strings.xml 里的 app_name
      - name: Update App Name
        run: |
           sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">我去抢个座<\/string>/' src-tauri/gen/android/app/src/main/res/values/strings.xml || true

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > src-tauri/gen/android/release.jks

      - name: Build APK
        run: pnpm tauri android build --apk --target ${{ matrix.target }}
        env:
          ANDROID_KEY_STORE_FILE: ../../../src-tauri/gen/android/release.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}

      - name: Rename and Checksum
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
             VERSION="manual-test"
          else
             VERSION=${{ github.ref_name }}
             VERSION=${VERSION#v}
          fi
          
          NEW_NAME="LibrarySeat_android_${VERSION}_${{ matrix.arch_name }}.apk"
          find src-tauri/gen/android/app/build/outputs/apk/*/release -name "app-*-release.apk" -exec mv {} $NEW_NAME \;
          sha256sum $NEW_NAME > ${NEW_NAME}.sha256
          
      - name: Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }} # 使用前面生成的 Tag 名
          releaseId: ${{ needs.create-release.outputs.release_id }}
          files: |
            *.apk
            *.sha256

  # ====================================================
  # 2. Linux 构建
  # ====================================================
  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install -g pnpm && pnpm install
      - uses: dtolnay/rust-toolchain@stable

      - name: Build Linux
        run: pnpm tauri build
      
      - name: Package and Rename
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
             VERSION="manual-test"
          else
             VERSION=${{ github.ref_name }}
             VERSION=${VERSION#v}
          fi
          BASE_NAME="LibrarySeat_linux_${VERSION}_amd64"

          mv src-tauri/target/release/bundle/appimage/*.AppImage ${BASE_NAME}.AppImage || true
          mv src-tauri/target/release/bundle/deb/*.deb ${BASE_NAME}.deb || true
          mv src-tauri/target/release/bundle/rpm/*.rpm ${BASE_NAME}.rpm || true

          # 打包二进制
          cd src-tauri/target/release/
          # 排除 bundle 目录，只打包二进制
          tar -czvf ../../../${BASE_NAME}.tar.gz --exclude='bundle' *[^.] 
          cd ../../../
          
          # 计算 hash (如果文件存在)
          [ -f "${BASE_NAME}.AppImage" ] && sha256sum ${BASE_NAME}.AppImage > ${BASE_NAME}.AppImage.sha256
          [ -f "${BASE_NAME}.deb" ] && sha256sum ${BASE_NAME}.deb > ${BASE_NAME}.deb.sha256
          [ -f "${BASE_NAME}.rpm" ] && sha256sum ${BASE_NAME}.rpm > ${BASE_NAME}.rpm.sha256
          [ -f "${BASE_NAME}.tar.gz" ] && sha256sum ${BASE_NAME}.tar.gz > ${BASE_NAME}.tar.gz.sha256

      - name: Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          files: |
            LibrarySeat_linux_*

  # ====================================================
  # 3. Windows 构建
  # ====================================================
  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install -g pnpm && pnpm install
      - uses: dtolnay/rust-toolchain@stable

      - name: Build Windows
        run: pnpm tauri build

      - name: Rename
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
             VERSION="manual-test"
          else
             VERSION=${{ github.ref_name }}
             VERSION=${VERSION#v}
          fi
          BASE_NAME="LibrarySeat_windows_${VERSION}_x64"

          mv src-tauri/target/release/bundle/nsis/*.exe ${BASE_NAME}_setup.exe
          
          if ls src-tauri/target/release/bundle/nsis/*.zip 1> /dev/null 2>&1; then
            mv src-tauri/target/release/bundle/nsis/*.zip ${BASE_NAME}.zip
          fi

          sha256sum ${BASE_NAME}_setup.exe > ${BASE_NAME}_setup.exe.sha256
          if [ -f "${BASE_NAME}.zip" ]; then
            sha256sum ${BASE_NAME}.zip > ${BASE_NAME}.zip.sha256
          fi

      - name: Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          files: |
            LibrarySeat_windows_*

  # ====================================================
  # 4. macOS 构建 (DMG)
  # ====================================================
  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install -g pnpm && pnpm install
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build macOS DMG
        run: pnpm tauri build --target universal-apple-darwin

      - name: Rename macOS
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
             VERSION="manual-test"
          else
             VERSION=${{ github.ref_name }}
             VERSION=${VERSION#v}
          fi
          BASE_NAME="LibrarySeat_macos_${VERSION}_universal"

          mv src-tauri/target/release/bundle/dmg/*.dmg ${BASE_NAME}.dmg
          sha256sum ${BASE_NAME}.dmg > ${BASE_NAME}.dmg.sha256

      - name: Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          files: |
            *.dmg
            *.sha256
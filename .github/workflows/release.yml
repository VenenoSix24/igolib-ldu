name: 'Release Build'

on:
  push:
    tags:
      - 'v*' # 推送 v 开头的标签触发构建发布
  workflow_dispatch: # 允许网页手动点击运行

jobs:
  # 任务 1：创建 Release 占位
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Get version
        run: echo "PACKAGE_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Create release
        id: create-release
        uses: actions/github-script@v6
        env:
          # 如果是 tag 触发，使用 tag 名；否则使用 manual-build
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || 'manual-build' }}
          # 如果 tag 包含 "-" 则设为 pre-release
          IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.TAG_NAME,
              name: `igolib-ldu ${process.env.TAG_NAME}`,
              body: 'Release assets for igolib-ldu',
              draft: true, // 初始必须为草稿，以便后续任务上传文件
              prerelease: process.env.IS_PRERELEASE === 'true'
            })
            return data.id

  # 任务 2：构建并上传
  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: '--apk true --split-per-abi --target aarch64'
            mobile: 'android'
          - platform: 'ubuntu-22.04'
            args: '--apk true --split-per-abi --target armv7'
            mobile: 'android'
          - platform: 'ubuntu-22.04'
            args: '--apk true --split-per-abi --target x86_64'
            mobile: 'android'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm' # 开启 pnpm 缓存，加速构建

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || (matrix.mobile == 'android' && 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android' || '') }}

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Setup java
        if: matrix.mobile == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup android sdk
        if: matrix.mobile == 'android'
        uses: android-actions/setup-android@v3

      # --- 安卓签名 ---
      - name: Prepare android signing
        if: matrix.mobile == 'android'
        shell: bash
        env:
          # 将 Secrets 映射为环境变量，比直接在 run 里拼接更安全
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          # 确保目录存在
          mkdir -p src-tauri/gen/android/app
          
          # 1. 解码 Keystore 文件
          echo "$KEYSTORE_BASE64" | base64 --decode > src-tauri/gen/android/app/release.jks
          
          # 2. 生成 properties 文件
          cat <<EOF > src-tauri/gen/android/keystore.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF

      # --- Tauri Action ---
      - uses: tauri-apps/tauri-action@dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          mobile: ${{ matrix.mobile }}

  # 任务 3：发布 (仅在 Tag 触发时运行)
  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri]
    # 如果是手动触发，不运行此步，Release 保持为 Draft
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')

    steps:
      - name: publish release
        uses: actions/github-script@v6
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false
            })